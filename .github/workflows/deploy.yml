# ============================================================
# CI/CD Frontend — Build → Push → Deploy
# ============================================================
# Pipeline automatizado que se activa al hacer push a la rama "deploy":
#   1. JOB build-and-push: construye la imagen Docker y la sube a Docker Hub
#   2. JOB deploy-to-ec2:  se conecta por SSH a la EC2 Frontend y la actualiza
#
# Secrets requeridos (ya configurados en GitHub Settings):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, EC2_SSH_KEY,
#   EC2_FRONTEND_HOST, BACKEND_URL, SECRET_KEY
# ============================================================

name: CI/CD Frontend - Build, Push & Deploy

# TRIGGER: solo se ejecuta cuando hay push a la rama "deploy"
on:
  push:
    branches:
      - deploy

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend

jobs:

  # ────────────────────────────────────────────────────────
  # JOB 1: Construir la imagen Docker y subirla a Docker Hub
  # ────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────
  # JOB 2: Desplegar la nueva imagen en la EC2 Frontend
  # ────────────────────────────────────────────────────────
  deploy-to-ec2:
    name: Deploy a EC2 Frontend
    runs-on: ubuntu-latest
    needs: build-and-push        # solo corre si el build anterior tuvo éxito

    steps:
      - name: Desplegar via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Autenticación con Docker Hub desde la EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Crear archivo .env con las variables que necesita docker-compose
            cat > /home/ec2-user/.env << 'ENVEOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_TAG=latest
            BACKEND_URL=${{ secrets.BACKEND_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ENVEOF

            # Descargar la nueva imagen y recrear el contenedor
            cd /home/ec2-user
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --force-recreate

            # Limpiar imágenes antiguas para no llenar el disco
            docker image prune -f

            # Mostrar el estado final
            docker compose ps

            echo "Deploy Frontend completado: $(date)"
